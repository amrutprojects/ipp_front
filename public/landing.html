<style>
/* =========================================================
   Design tokens: the IPP portal's palette (ipp_frontend/src/styles.css)
   ========================================================= */
:root{
  --dark-950:#2b1204;
  --dark-900:#3f1b06;
  --dark-800:#5c2a0d;
  --dark-700:#8a4116;
  --brand-700:#8a4116;
  --brand-600:#b5551c;
  --brand-500:#d2691e;
  --saffron:#e88c2c;
  --saffron-100:#fdeedb;
  --tint-100:#fbe3cb;
  --tint-50:#fff6ec;
  --glow:#f6b26b;
  --ink:#3f1b06;
  --text:#3a2a1d;
  --muted:#6b5647;
  --line:#f0dcc6;
  --line-strong:#e0c3a3;
  --bg:#ffffff;
  --bg-soft:#fef8f1;
  --bg-hero:#fff6ec;
  --hero-dark:linear-gradient(150deg,#3f1b06 0%,#5c2a0d 50%,#8a4116 100%);
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(90,50,20,.05),0 2px 8px rgba(90,50,20,.06);
  --shadow-md:0 2px 4px rgba(90,50,20,.05),0 10px 26px -10px rgba(90,50,20,.22);
  --shadow-lg:0 28px 56px -20px rgba(63,27,6,.38);
  --header-h:72px;
  --container:1200px;
  --gutter:24px;
  --font:"Noto Sans","Noto Sans Devanagari",Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (max-width:639px){:root{--gutter:16px;--header-h:66px}}

/* =========================================================
   Base
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;font-family:var(--font);font-size:1rem;line-height:1.65;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
body.menu-open{overflow:hidden}
h1,h2,h3,h4{color:var(--ink);line-height:1.2;margin:0 0 .5em;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 1em}
a{color:var(--brand-600)}
ul,ol{margin:0;padding:0}
svg{display:block}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--brand-500);outline-offset:3px;border-radius:6px}
.on-dark :focus-visible{outline-color:#fff}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.container{width:100%;max-width:calc(var(--container) + var(--gutter)*2);margin:0 auto;padding:0 var(--gutter)}
section[id]{scroll-margin-top:calc(var(--header-h) + 8px)}
.skip-link{position:absolute;left:16px;top:-100px;z-index:1000;background:var(--dark-800);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;text-decoration:none}
.skip-link:focus{top:12px}

/* Loading: only while the content is fetched for the first time */
.page-loader{min-height:70vh;display:grid;place-items:center;align-content:center;gap:14px;color:var(--muted);font-weight:600}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--tint-100);border-top-color:var(--brand-600);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
html:not(.js) .page-loader{display:none}
.noscript{padding:64px 0;text-align:center}

/* =========================================================
   Buttons
   ========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.75rem 1.35rem;border-radius:10px;border:2px solid transparent;font:inherit;font-size:.86rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;line-height:1.2;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}
.btn .icon{width:18px;height:18px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn .icon-arrow{transition:transform .2s}
.btn:hover .icon-arrow{transform:translateX(3px)}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 8px 18px -8px rgba(181,85,28,.7)}
.btn-primary:hover{background:var(--brand-700);color:#fff;box-shadow:0 12px 24px -10px rgba(138,65,22,.7)}
.btn-secondary{background:#fff;color:var(--dark-800);border-color:var(--dark-800)}
.btn-secondary:hover{background:var(--dark-800);color:#fff}
.btn-outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.75)}
.btn-outline-light:hover{background:#fff;color:var(--dark-900);border-color:#fff}
.btn-closed{background:var(--saffron-100);color:var(--muted);border-color:var(--line-strong);cursor:not-allowed;box-shadow:none}
.btn-closed:hover{transform:none}
.btn-sm{min-height:40px;padding:.5rem .95rem;font-size:.76rem}
.btn-lg{min-height:52px;padding:.9rem 1.6rem;font-size:.9rem}
.btn-block{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* =========================================================
   Header & navigation
   ========================================================= */
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);-webkit-backdrop-filter:saturate(180%) blur(10px);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
.site-header::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--dark-800),var(--brand-600) 60%,var(--saffron))}
.site-header.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 24px -12px rgba(63,27,6,.25)}
.header-inner{display:flex;align-items:center;gap:12px;height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{position:relative;flex:none;width:42px;height:42px;border-radius:11px;background:var(--dark-800);color:#fff;display:grid;place-items:center;overflow:hidden}
.brand-mark::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--saffron)}
.brand-mark .icon{width:24px;height:24px;margin-top:-3px}
.brand-logo{display:block;height:46px;width:auto;max-width:190px;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1.1;font-weight:800;text-transform:uppercase;white-space:nowrap;min-width:0}
.brand-text .l1{font-size:.84rem;color:var(--dark-800);letter-spacing:.015em}
.brand-text .l2{font-size:.69rem;color:var(--brand-600);letter-spacing:.07em;margin-top:3px}
.nav{display:none}
.nav ul{display:flex;align-items:center;list-style:none;gap:0}
.nav a{position:relative;display:block;padding:8px 8px;border-radius:8px;font-size:.84rem;font-weight:600;color:var(--text);text-decoration:none;white-space:nowrap;transition:color .2s,background-color .2s}
.nav a:hover{color:var(--dark-800);background:var(--saffron-100)}
.nav a.active{color:var(--brand-600)}
.nav a.active::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:2px;background:var(--brand-600)}
.header-cta{display:flex;align-items:center;gap:8px;flex:none}
.nav-toggle{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--dark-800);cursor:pointer;transition:background-color .2s,border-color .2s}
.nav-toggle:hover{background:var(--saffron-100);border-color:var(--line-strong)}
.nav-toggle .icon{width:22px;height:22px}
.nav-toggle .i-close,.nav-toggle[aria-expanded="true"] .i-open{display:none}
.nav-toggle[aria-expanded="true"] .i-close{display:block}
.menu-backdrop{position:fixed;inset:0;z-index:98;background:rgba(43,18,4,.45);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.menu-backdrop.open{opacity:1;visibility:visible;transition:opacity .25s}
.mobile-menu{position:fixed;top:var(--header-h);left:0;right:0;z-index:99;max-height:calc(100vh - var(--header-h));overflow-y:auto;background:#fff;border-top:1px solid var(--line);box-shadow:0 24px 40px -16px rgba(63,27,6,.35);padding:8px var(--gutter) 20px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s,transform .25s,visibility 0s .25s}
.mobile-menu.open{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s}
.mobile-menu ul{list-style:none;max-width:var(--container);margin:0 auto}
.mobile-menu li a{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 4px;border-bottom:1px solid var(--line);color:var(--ink);font-weight:700;text-decoration:none}
.mobile-menu li a::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg)}
.mobile-menu li a.active{color:var(--brand-600)}
.mobile-menu-cta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;max-width:var(--container);margin:18px auto 0}
.mobile-menu-cta:empty{display:none}
@media (min-width:1240px){
  .nav{display:block}
  .nav-toggle,.mobile-menu,.menu-backdrop{display:none}
  .header-cta{margin-left:6px}
}
@media (max-width:560px){.header-cta{display:none}}
@media (max-width:380px){
  .brand-mark{width:38px;height:38px}
  .brand-logo{height:38px;max-width:150px}
  .brand-text .l1{font-size:.76rem}
  .brand-text .l2{font-size:.62rem}
}

/* =========================================================
   Shared section styles
   ========================================================= */
.section{padding:clamp(64px,8vw,104px) 0}
.section-soft{background:var(--bg-soft)}
.section-head{max-width:740px;margin:0 auto clamp(36px,4vw,52px);text-align:center}
.section-head h2{font-size:clamp(1.75rem,1.15rem + 2vw,2.6rem);color:var(--dark-900)}
.section-head p{color:var(--muted);font-size:1.05rem;margin:0}
.section-head.left{text-align:left;margin-left:0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;margin:0 0 12px;font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-600)}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:2px;border-radius:2px;background:currentColor;opacity:.55}
.section-head.left .eyebrow::after{display:none}
.lead{font-size:1.12rem;color:var(--ink);font-weight:500}
.fine{font-size:.88rem;color:var(--muted)}
.callout{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:14px;background:var(--saffron-100);border:1px solid var(--line-strong);color:var(--text)}
.callout p{margin:0}
.callout strong{color:var(--ink)}
.c-ico{flex:none;width:40px;height:40px;border-radius:10px;background:#fff;color:var(--dark-800);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.callout-warm{background:var(--tint-50);border-color:var(--tint-100)}
.callout-warm .c-ico{color:var(--brand-600)}
.callout-accent{background:linear-gradient(135deg,var(--brand-600),var(--dark-700));border:0;color:#fff3e6}
.callout-accent strong{color:#fff}
.callout-accent .c-ico{color:var(--brand-600)}
.cta-inline{margin-top:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;padding:22px 26px;border-radius:16px;background:#fff;border:1px dashed var(--line-strong)}
.section:not(.section-soft) .cta-inline{background:var(--bg-soft)}
.cta-inline p{margin:0;font-weight:700;color:var(--ink);font-size:1.05rem}
.cta-inline p span{display:block;font-weight:500;font-size:.92rem;color:var(--muted)}
.reveal-on .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;transition-delay:calc(var(--d,0) * 70ms)}
.reveal-on .reveal.in{opacity:1;transform:none}

/* =========================================================
   Hero
   ========================================================= */
.hero{position:relative;padding:clamp(40px,6vw,76px) 0 0;background:linear-gradient(180deg,var(--bg-hero) 0,var(--bg-hero) calc(100% - 72px),var(--bg) calc(100% - 72px))}
.hero-bg{position:absolute;inset:0 0 72px 0;overflow:hidden;pointer-events:none}
.hero-bg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(92,42,13,.12) 1px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 90%);mask-image:linear-gradient(180deg,#000 0,transparent 90%)}
.hero-bg::after{content:"";position:absolute;width:620px;height:620px;right:-200px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(232,140,44,.22),transparent 65%)}
.hero-grid{position:relative;display:grid;gap:40px;align-items:center}
.eyebrow-pill{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0;padding:5px 14px 5px 5px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:.8rem;font-weight:700;color:var(--dark-800)}
@media (max-width:520px){.eyebrow-pill{border-radius:14px;padding:6px 12px 6px 6px;font-size:.76rem}}
.eyebrow-pill .tag{background:var(--brand-600);color:#fff;border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:800;letter-spacing:.06em}
.hero-title{margin:22px 0 16px;font-size:clamp(1.7rem,.95rem + 3.5vw,3.45rem);line-height:1.08;color:var(--dark-900)}
.hero-title .accent{display:block;color:var(--brand-600)}
.tagline{font-size:clamp(1.05rem,.95rem + .5vw,1.28rem);font-weight:700;color:var(--dark-700);margin-bottom:18px;line-height:1.45}
.hero-copy .desc{color:var(--muted);max-width:62ch}
.hero-copy .desc strong{color:var(--ink)}
.hero-copy .actions{margin-top:28px}
.hero-fine{display:flex;gap:8px;align-items:flex-start;margin:18px 0 0;font-size:.86rem;color:var(--muted)}
.hero-fine .icon{width:18px;height:18px;color:var(--dark-700);margin-top:2px}
.snapshot{position:relative;overflow:hidden;border-radius:24px;padding:clamp(22px,3vw,30px);background:var(--hero-dark);color:#f3e3d3;box-shadow:var(--shadow-lg)}
.snapshot::before{content:"";position:absolute;width:300px;height:300px;right:-110px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(232,140,44,.45),transparent 68%);pointer-events:none}
.snap-head{position:relative;display:flex;gap:14px;align-items:center;margin-bottom:20px}
.snap-icon{flex:none;width:48px;height:48px;border-radius:12px;background:var(--brand-600);color:#fff;display:grid;place-items:center}
.snap-icon .icon{width:24px;height:24px}
.kicker{margin:0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--glow)}
.snap-title{margin:0;color:#fff;font-size:1.15rem;font-weight:800;line-height:1.3}
.snap-list{position:relative;list-style:none;display:grid;gap:7px;margin-bottom:22px}
.snap-list li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:.91rem;line-height:1.35;transition:background-color .2s,transform .2s}
.snap-list li:hover{background:rgba(255,255,255,.12);transform:translateX(3px)}
.snap-list .ico{flex:none;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.1);color:var(--glow);display:grid;place-items:center}
.snap-list .ico .icon{width:17px;height:17px}
.mix-labels{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;margin-bottom:8px}
.mix-labels b{font-weight:800}
.mix-bar{display:flex;gap:3px;height:10px;border-radius:999px;overflow:hidden}
.mix-bar span{display:block;height:100%}
.snapshot .mix-labels b{color:#fff}
.snapshot .mix-bar span:first-child{background:#fff}
.snapshot .mix-bar span:last-child{background:var(--saffron)}
.snap-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;list-style:none}
.snap-foot li{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:700;font-size:.8rem}
.hero-stats{position:relative;margin-top:clamp(40px,5vw,64px)}
.stats-grid{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;padding:20px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-md);transition:transform .25s,box-shadow .25s,border-color .25s}
.stat:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
.stat-ico{width:42px;height:42px;border-radius:11px;background:var(--saffron-100);color:var(--dark-800);display:grid;place-items:center;margin-bottom:8px}
.stat:nth-child(odd) .stat-ico{background:var(--tint-100);color:var(--brand-600)}
.stat-val{font-size:clamp(1.45rem,1.1rem + 1vw,1.85rem);font-weight:800;color:var(--dark-900);line-height:1.1;letter-spacing:-.02em}
.stat-val.word{font-size:clamp(1.2rem,1rem + .6vw,1.45rem);line-height:1.27}
.stat-lbl{font-size:.86rem;font-weight:600;color:var(--muted);line-height:1.35}
@media (min-width:992px){.hero-grid{grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);gap:56px}.hero-grid.solo{grid-template-columns:minmax(0,1fr)}}
@media (min-width:1100px){.stats-grid{gap:16px}}

/* =========================================================
   About
   ========================================================= */
.about-grid{display:grid;gap:40px}
.focus-chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.focus-chips li{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg-soft);font-size:.84rem;font-weight:600;color:var(--dark-800)}
.pillars{list-style:none;display:grid;gap:16px}
.pillar{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;padding:24px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s,border-color .25s}
.pillar:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.pillar-ico{width:56px;height:56px;border-radius:14px;background:var(--dark-800);color:#fff;display:grid;place-items:center}
.pillar-ico .icon{width:26px;height:26px}
.pillar:nth-child(even) .pillar-ico{background:var(--brand-600)}
.pillar-num{position:absolute;top:16px;right:20px;font-size:2rem;font-weight:800;line-height:1;color:var(--saffron-100)}
.pillar h3{font-size:1.1rem;margin:0 0 .3rem;padding-right:40px}
.pillar p{margin:0;color:var(--muted);font-size:.95rem}
@media (min-width:992px){.about-grid{grid-template-columns:1fr 1fr;gap:64px;align-items:center}.about-grid.solo{grid-template-columns:minmax(0,1fr)}}

/* =========================================================
   Courses
   ========================================================= */
.course-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.course{position:relative;overflow:hidden;flex:1 1 100%;max-width:100%;display:flex;flex-direction:column;padding:22px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s,border-color .25s}
.course::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--dark-800),var(--brand-600),var(--saffron));transform:scaleX(.22);transform-origin:left;transition:transform .4s ease}
.course:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--line-strong)}
.course:hover::before{transform:scaleX(1)}
.course-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.course-ico{width:52px;height:52px;border-radius:14px;background:var(--dark-800);color:#fff;display:grid;place-items:center;transition:background-color .25s}
.course:hover .course-ico{background:var(--brand-600)}
.course-ico .icon{width:26px;height:26px}
.course-no{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-700);background:var(--tint-50);border:1px solid var(--tint-100);padding:4px 10px;border-radius:999px}
.course h3{font-size:1.05rem;line-height:1.35;margin:0 0 .5rem}
.course-desc{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.tech{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tech li{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;background:var(--saffron-100);color:var(--dark-800);font-size:.76rem;font-weight:700;line-height:1.2}
.tech .icon{width:13px;height:13px;color:var(--brand-600);stroke-width:3}
.course-foot{margin-top:auto}
.courses-note{max-width:820px;margin:32px auto 0;text-align:center}
@media (min-width:640px){.course{flex-basis:calc(50% - 10px);max-width:calc(50% - 10px)}}
@media (min-width:1100px){.course{flex-basis:calc(25% - 15px);max-width:calc(25% - 15px)}}

/* =========================================================
   Programme structure
   ========================================================= */
.structure-grid{display:grid;gap:28px}
.fact-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 16px}
.fact{padding:20px 22px;border-radius:16px;background:var(--bg-soft);border:1px solid var(--line);transition:transform .25s,border-color .25s}
.fact:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.fact dt{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fact dt .icon{width:16px;height:16px;color:var(--brand-600)}
.fact dd{margin:0;font-size:clamp(1.55rem,1.15rem + 1.2vw,2.15rem);font-weight:800;color:var(--dark-800);line-height:1.1;letter-spacing:-.02em}
.mix-card{padding:18px 22px;border-radius:16px;border:1px solid var(--line);margin-bottom:16px}
.mix-card .mix-labels{color:var(--muted);font-weight:600}
.mix-card .mix-labels b{color:var(--ink)}
.mix-card .mix-bar{height:12px}
.mix-card .mix-bar span:first-child{background:var(--dark-800)}
.mix-card .mix-bar span:last-child{background:var(--saffron)}
.stages{padding:28px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.stages-title{font-size:1.15rem;margin-bottom:10px}
.stage-list{list-style:none;counter-reset:stage}
.stage{position:relative;display:grid;grid-template-columns:40px 1fr;gap:14px;padding:11px 0}
.stage::before{counter-increment:stage;content:counter(stage);position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--saffron-100);border:2px solid var(--line-strong);color:var(--dark-800);font-weight:800;display:grid;place-items:center;transition:background-color .2s,color .2s,border-color .2s}
.stage::after{content:"";position:absolute;left:19px;top:51px;bottom:-11px;width:2px;background:var(--line-strong)}
.stage:last-child::after{display:none}
.stage:hover::before{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.stage h4{font-size:1rem;margin:7px 0 2px}
.stage p{margin:0;font-size:.9rem;color:var(--muted)}
.months{margin-top:clamp(48px,6vw,72px)}
.months-title{text-align:center;font-size:clamp(1.2rem,1rem + .6vw,1.45rem);margin-bottom:28px}
.month-track{position:relative;list-style:none;display:grid;gap:18px}
.month{position:relative;text-align:center}
.month-dot{position:relative;z-index:1;width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:var(--dark-800);color:#fff;font-weight:800;font-size:1.15rem;display:grid;place-items:center;box-shadow:0 0 0 6px #fff,0 0 0 7px var(--line-strong)}
.month:nth-child(3n+2) .month-dot{background:var(--brand-600)}
.month:nth-child(3n) .month-dot{background:var(--saffron)}
.month-card{padding:22px;border-radius:18px;background:var(--bg-soft);border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.month:hover .month-card{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.m-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--brand-600)}
.month-card h4{font-size:1.08rem;margin:.25rem 0 .8rem}
.month-card ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.month-card li{padding:5px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--dark-800);line-height:1.3}
.months .fine{text-align:center;margin:20px 0 0}
@media (min-width:900px){
  .month-track{grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:24px}
  .month-track::before{content:"";position:absolute;top:27px;left:calc(50% / var(--n,3));right:calc(50% / var(--n,3));height:3px;border-radius:3px;background:linear-gradient(90deg,var(--dark-800),var(--brand-600),var(--saffron))}
  .month-card{height:calc(100% - 72px)}
}
@media (min-width:992px){.structure-grid{grid-template-columns:1fr 1fr;gap:40px;align-items:start}.structure-grid.solo{grid-template-columns:minmax(0,1fr)}}

/* =========================================================
   Benefits
   ========================================================= */
.benefit-grid{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.benefit{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:20px 18px;border-radius:16px;background:#fff;border:1px solid var(--line);transition:transform .25s,box-shadow .25s,border-color .25s}
.benefit::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--brand-600);transition:width .35s ease}
.benefit:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.benefit:hover::after{width:100%}
.benefit-ico{width:44px;height:44px;border-radius:12px;background:var(--dark-800);color:#fff;display:grid;place-items:center}
.benefit:nth-child(3n+2) .benefit-ico{background:var(--brand-600)}
.benefit h3{font-size:.97rem;line-height:1.35;margin:0}
.bn{position:absolute;top:14px;right:16px;font-size:.8rem;font-weight:800;color:var(--line-strong)}
.benefit-note{margin-top:28px}
@media (min-width:992px){.benefit-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}}

/* =========================================================
   Eligibility
   ========================================================= */
.elig-grid{display:grid;gap:28px}
.elig-list{list-style:none;display:grid;gap:12px}
.elig-item{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:14px;background:#fff;border:1px solid var(--line);transition:transform .25s,box-shadow .25s,border-color .25s}
.elig-item:hover{transform:translateX(3px);box-shadow:var(--shadow-sm);border-color:var(--line-strong)}
.elig-ico{position:relative;flex:none;width:48px;height:48px;border-radius:12px;background:var(--saffron-100);color:var(--dark-800);display:grid;place-items:center}
.elig-ico .badge{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--brand-600);color:#fff;border:2px solid #fff;display:grid;place-items:center}
.elig-ico .badge .icon{width:11px;height:11px;stroke-width:3.5}
.elig-item h3{font-size:1rem;margin:2px 0 .2rem}
.elig-item p{margin:0;color:var(--muted);font-size:.95rem}
.community{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.community li{padding:4px 12px;border-radius:999px;background:var(--tint-50);border:1px solid var(--tint-100);color:var(--brand-700);font-weight:700;font-size:.84rem}
.elig-summary{position:relative;overflow:hidden;padding:28px;border-radius:20px;background:var(--hero-dark);color:#f0dfcf;box-shadow:var(--shadow-lg)}
.elig-summary::before{content:"";position:absolute;width:260px;height:260px;right:-100px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(232,140,44,.4),transparent 68%);pointer-events:none}
.elig-summary h3{position:relative;color:#fff;font-size:1.3rem;margin:4px 0 14px}
.glance{position:relative;margin:0 0 20px}
.glance div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.glance dt{color:#e6cdb6;font-size:.9rem;flex:none}
.glance dd{margin:0;color:#fff;font-weight:700;text-align:right;line-height:1.4}
.verify-note{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:.9rem;margin-bottom:20px}
.verify-note .icon{color:var(--glow);margin-top:1px}
.verify-note p{margin:0}
.elig-summary .actions{position:relative}
.elig-summary .actions .btn{flex:1 1 140px}
.elig-fine{margin:14px 0 0}
@media (min-width:992px){
  .elig-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,.9fr);gap:36px;align-items:start}
  .elig-grid.solo{grid-template-columns:minmax(0,1fr)}
  .elig-summary{position:sticky;top:calc(var(--header-h) + 24px)}
}

/* =========================================================
   Documents
   ========================================================= */
.doc-grid{list-style:none;display:grid;gap:14px}
.doc{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:16px;background:#fff;border:1px solid var(--line);transition:transform .25s,box-shadow .25s,border-color .25s}
.doc:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--tint-100)}
.doc-ico{flex:none;width:48px;height:48px;border-radius:12px;background:var(--tint-50);color:var(--brand-600);display:grid;place-items:center;transition:background-color .25s,color .25s}
.doc:hover .doc-ico{background:var(--brand-600);color:#fff}
.doc-ico .icon{width:22px;height:22px}
.doc p{margin:0;font-weight:600;color:var(--ink);font-size:.95rem;line-height:1.5}
.doc-num{display:block;font-size:.72rem;font-weight:800;letter-spacing:.12em;color:var(--brand-600);margin-bottom:2px}
.doc-callout{margin-top:24px}
@media (min-width:640px){.doc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
@media (min-width:1024px){.doc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.doc{flex-direction:column;align-items:flex-start;padding:22px}}

/* =========================================================
   Candidate journey
   ========================================================= */
.timeline{position:relative;list-style:none;display:grid;gap:4px;max-width:720px;margin:0 auto}
.timeline::before{content:"";position:absolute;left:27px;top:30px;bottom:30px;width:2px;background:linear-gradient(180deg,var(--dark-700),var(--saffron))}
.step{position:relative;display:grid;grid-template-columns:56px 1fr;gap:18px;padding:10px 0}
.step-marker{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid var(--line-strong);color:var(--dark-800);display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:background-color .25s,color .25s,border-color .25s,transform .25s}
.step-marker .icon{width:22px;height:22px}
.step-num{position:absolute;top:-5px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--brand-600);color:#fff;border:2px solid #fff;font-size:.7rem;font-weight:800;display:grid;place-items:center}
.step:hover .step-marker{background:var(--dark-800);border-color:var(--dark-800);color:#fff;transform:scale(1.05)}
.step-body{padding-top:6px}
.step h3{font-size:1.02rem;margin:0 0 .3rem}
.step p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.55}
.journey-note{margin-top:32px}
@media (min-width:900px){
  .timeline{max-width:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 28px}
  .timeline::before{display:none}
  .step{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px;padding:0}
  .step::after{content:"";position:absolute;top:28px;left:calc(50% + 40px);width:calc(100% + 28px - 80px);height:2px;background:linear-gradient(90deg,var(--dark-700),var(--saffron));opacity:.6}
  .step:nth-child(4n)::after,.step:last-child::after{display:none}
  .step-body{padding-top:0;max-width:250px}
  .step h3{font-size:1rem}
  .step p{font-size:.88rem}
}

/* =========================================================
   Placement (dark section)
   ========================================================= */
.section-dark{position:relative;overflow:hidden;background:radial-gradient(ellipse at 88% 0%,rgba(232,140,44,.28),transparent 55%),linear-gradient(160deg,var(--dark-800),var(--dark-950));color:#f0dfcf}
.section-dark h2{color:#fff}
.section-dark .eyebrow{color:var(--glow)}
.section-dark .lead{color:#fbeee0}
.placement-grid{position:relative;display:grid;gap:40px}
.support-grid{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.support{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#fff;font-weight:600;font-size:.94rem;line-height:1.35;transition:background-color .25s,border-color .25s,transform .25s}
.support:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);transform:translateY(-2px)}
.s-ico{flex:none;width:42px;height:42px;border-radius:11px;background:rgba(246,178,107,.16);color:var(--glow);display:grid;place-items:center}
.disclaimer{display:flex;gap:12px;align-items:flex-start;margin:24px 0 28px;padding:16px 18px;border-radius:12px;background:rgba(255,255,255,.07);border-left:4px solid var(--glow);font-size:.93rem}
.disclaimer .icon{color:var(--glow);margin-top:2px}
.disclaimer p{margin:0}
.disclaimer strong{color:#fff}
@media (max-width:420px){.support-grid{grid-template-columns:1fr}}
@media (min-width:992px){.placement-grid{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:56px;align-items:center}.placement-grid.solo{grid-template-columns:minmax(0,1fr)}}

/* =========================================================
   FAQ accordion
   ========================================================= */
.faq-list{max-width:880px;margin:0 auto;display:grid;gap:12px}
.faq-item{background:#fff;border:1px solid var(--line);border-radius:14px;transition:border-color .25s,box-shadow .25s}
.faq-item:hover{border-color:var(--line-strong)}
.faq-item.open{border-color:var(--line-strong);box-shadow:var(--shadow-md)}
.faq-h{margin:0;font-size:1rem;letter-spacing:0}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;margin:0;background:none;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:1rem;line-height:1.45;color:var(--ink);text-align:left;cursor:pointer}
.faq-q:hover{color:var(--dark-700)}
.faq-icon{position:relative;flex:none;width:32px;height:32px;border-radius:50%;background:var(--saffron-100);transition:background-color .25s}
.faq-icon::before,.faq-icon::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;border-radius:2px;background:var(--dark-800);transform:translate(-50%,-50%);transition:transform .3s,background-color .25s}
.faq-icon::after{transform:translate(-50%,-50%) rotate(90deg)}
.faq-item.open .faq-icon{background:var(--brand-600)}
.faq-item.open .faq-icon::before,.faq-item.open .faq-icon::after{background:#fff}
.faq-item.open .faq-icon::after{transform:translate(-50%,-50%) rotate(0deg)}
.faq-a{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease,visibility 0s linear 0s}
.faq-a > div{overflow:hidden}
.faq-a p{margin:0;padding:0 20px 14px;color:var(--muted)}
.faq-a > div > :last-child{padding-bottom:20px}
.faq-a a{font-weight:700;word-break:break-word}
.faq-courses{margin:0;padding:0 20px 20px 40px;color:var(--muted);display:grid;gap:4px}
.faq-courses li::marker{color:var(--brand-600)}
.js .faq-item:not(.open) .faq-a{grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s linear .3s}

/* =========================================================
   Final call to action
   ========================================================= */
.final-cta{padding:0 0 clamp(64px,8vw,104px)}
.final-cta.first{padding-top:clamp(64px,8vw,104px)}
.cta-card{position:relative;overflow:hidden;display:grid;gap:28px;align-items:center;padding:clamp(30px,5vw,58px);border-radius:26px;background:radial-gradient(circle at 100% 0%,rgba(232,140,44,.5),transparent 52%),linear-gradient(135deg,var(--dark-800),var(--dark-950));color:#f0dfcf;box-shadow:var(--shadow-lg)}
.cta-card::before{content:"";position:absolute;width:340px;height:340px;right:-90px;bottom:-170px;border-radius:50%;border:44px solid rgba(255,255,255,.05);pointer-events:none}
.cta-card h2{position:relative;color:#fff;font-size:clamp(1.7rem,1.15rem + 2.2vw,2.7rem)}
.cta-card > div{position:relative}
.cta-card p{font-size:1.08rem;max-width:56ch;margin:0}
.cta-points{list-style:none;display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:22px}
.cta-points li{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:.92rem}
.cta-points .icon{width:18px;height:18px;color:var(--glow);stroke-width:2.6}
@media (min-width:900px){.cta-card{grid-template-columns:minmax(0,1.4fr) auto}}

/* =========================================================
   Footer
   ========================================================= */
.site-footer{background:var(--dark-950);color:#e2c9b3;padding:64px 0 0;font-size:.94rem}
.footer-grid{display:grid;gap:36px}
.site-footer h3{color:#fff;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 16px}
.site-footer ul{list-style:none;display:grid;gap:9px}
.site-footer a:not(.btn){color:#f3e1cf;text-decoration:none;transition:color .2s}
.site-footer a:not(.btn):hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
.brand-light{margin:0 0 16px}
.brand-light .brand-mark{background:#fff;color:var(--dark-800)}
.brand-light .l1{color:#fff}
.brand-light .l2{color:var(--glow)}
.brand-light .brand-logo{background:#fff;border-radius:10px;padding:5px 8px;height:52px}
.footer-about p{max-width:42ch}
.footer-portal p{margin-bottom:16px}
.footer-portal .actions{flex-direction:column;align-items:stretch;max-width:280px}
.footer-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;margin-top:48px;padding-top:20px;padding-bottom:24px;border-top:1px solid rgba(255,255,255,.12);font-size:.84rem}
.footer-bottom p{margin:0}
@media (min-width:561px){.footer-bottom{padding-right:calc(var(--gutter) + 60px)}}
@media (min-width:640px){.footer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1024px){.footer-grid{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:40px}.footer-grid > :first-child{grid-column:span 1}}

/* =========================================================
   Phone action bar & back-to-top
   ========================================================= */
.mobile-bar{display:none}
.to-top{position:fixed;right:20px;bottom:20px;z-index:80;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--dark-800);color:#fff;box-shadow:var(--shadow-md);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .25s,transform .25s,visibility 0s .25s,background-color .2s}
.to-top.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s,background-color .2s}
.to-top:hover{background:var(--brand-600)}
@media (max-width:560px){
  .mobile-bar.on{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:90;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -8px 24px -12px rgba(63,27,6,.3)}
  .mobile-bar .btn{min-height:46px;padding:.6rem .8rem}
  body.has-bar{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  body.has-bar .to-top{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .to-top{right:16px;width:42px;height:42px}
  .cta-inline{padding:20px}
  .cta-inline .actions,.cta-card .actions,.hero-copy .actions{width:100%}
  .cta-inline .actions .btn,.cta-card .actions .btn,.hero-copy .actions .btn{flex:1 1 140px}

    if (!sectionOn('benefits')) return '';
    var b = C.benefits, items = shown(b.items);
    return '<section class="section section-soft" id="benefits" aria-labelledby="benefits-title"><div class="container">' + head('benefits') +
      (items.length ? '<ul class="benefit-grid">' + items.map(function (x, i) {
        return '<li class="benefit reveal" style="--d:' + (i % 5) + '"><span class="bn" aria-hidden="true">' + two(i + 1) + '</span><span class="benefit-ico" aria-hidden="true">' + icon(x.icon) + '</span><h3>' + esc(x.title) + '</h3></li>';
      }).join('') + '</ul>' : '') +
      (note(b.attendance_note, 'callout-accent', 'user-check') ? '<div class="benefit-note">' + note(b.attendance_note, 'callout-accent', 'user-check') + '</div>' : '') +
      '</div></section>';
  }

  function eligibility() {
    if (!sectionOn('eligibility')) return '';
    var e = C.eligibility, items = shown(e.items), s = e.summary;
    var summaryOn = isObj(s) && s.enabled !== false;
    var rows = summaryOn ? list(s.rows).filter(function (r) { return isObj(r) && (r.label || r.value); }) : [];
    var left = items.length || e.fine_print ? '<div>' + (items.length ? '<ol class="elig-list">' + items.map(function (x) {
      var chips = list(x.chips).filter(Boolean);
      return '<li class="elig-item reveal"><span class="elig-ico" aria-hidden="true">' + icon(x.icon) + '<span class="badge">' + icon('check') + '</span></span><div><h3>' + esc(x.title) + '</h3>' + (x.text ? '<p>' + rich(x.text) + '</p>' : '') +
        (chips.length ? '<ul class="community">' + chips.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' : '') + '</div></li>';
    }).join('') + '</ol>' : '') + (e.fine_print ? '<p class="fine elig-fine">' + esc(e.fine_print) + '</p>' : '') + '</div>' : '';
    var right = summaryOn ? '<aside class="elig-summary on-dark reveal" style="--d:1" aria-labelledby="glance-title">' + (s.kicker ? '<p class="kicker">' + esc(s.kicker) + '</p>' : '') + '<h3 id="glance-title">' + esc(s.title || 'Eligibility') + '</h3>' +
      (rows.length ? '<dl class="glance">' + rows.map(function (r) { return '<div><dt>' + esc(r.label) + '</dt><dd>' + esc(r.value) + '</dd></div>'; }).join('') + '</dl>' : '') +
      (s.note ? '<div class="verify-note">' + icon('shield') + '<p>' + esc(s.note) + '</p></div>' : '') +
      actions(pair(s.primary, s.secondary, { dark: true })) + '</aside>' : '';
    return '<section class="section" id="eligibility" aria-labelledby="eligibility-title"><div class="container">' + head('eligibility') +
      '<div class="elig-grid' + (left && right ? '' : ' solo') + '">' + left + right + '</div></div></section>';
  }

  function documents() {
    if (!sectionOn('documents')) return '';
    var d = C.documents, items = shown(d.items);
    return '<section class="section section-soft" id="documents" aria-labelledby="documents-title"><div class="container">' + head('documents') +
      (items.length ? '<ol class="doc-grid">' + items.map(function (x, i) {
        return '<li class="doc reveal" style="--d:' + (i % 4) + '"><span class="doc-ico" aria-hidden="true">' + icon(x.icon) + '</span><p><span class="doc-num" aria-hidden="true">' + two(i + 1) + '</span>' + esc(x.text) + '</p></li>';
      }).join('') + '</ol>' : '') +
      (note(d.note) ? '<div class="doc-callout">' + note(d.note) + '</div>' : '') + ctaBlock(d.cta) + '</div></section>';
  }

  function journey() {
    if (!sectionOn('journey')) return '';
    var j = C.journey, steps = shown(j.steps);
    return '<section class="section" id="journey" aria-labelledby="journey-title"><div class="container">' + head('journey') +
      (steps.length ? '<ol class="timeline">' + steps.map(function (st, i) {
        return '<li class="step reveal" style="--d:' + (i % 8) + '"><span class="step-marker" aria-hidden="true">' + icon(st.icon) + '<span class="step-num">' + (i + 1) + '</span></span><div class="step-body"><h3><span class="sr-only">Step ' + (i + 1) + ': </span>' + esc(st.title) + '</h3>' + (st.text ? '<p>' + esc(st.text) + '</p>' : '') + '</div></li>';
      }).join('') + '</ol>' : '') +
      (note(j.note) ? '<div class="journey-note">' + note(j.note) + '</div>' : '') + ctaBlock(j.cta) + '</div></section>';
  }

  function placement() {
    if (!sectionOn('placement')) return '';
    var p = C.placement, items = shown(p.items), n = p.note;
    var copy = '<div class="reveal">' + head('placement', false) + (p.lead ? '<p class="lead">' + rich(p.lead) + '</p>' : '') +
      (isObj(n) && n.enabled !== false && (n.title || n.text) ? '<div class="disclaimer">' + icon('info') + '<p>' + (n.title ? '<strong>' + esc(n.title) + '</strong> ' : '') + rich(n.text) + '</p></div>' : '') +
      actions(pair(p.primary, p.secondary, { size: 'btn-lg', dark: true, arrow: true })) + '</div>';
    return '<section class="section section-dark on-dark" id="placement" aria-labelledby="placement-title"><div class="container placement-grid' + (items.length ? '' : ' solo') + '">' + copy +
      (items.length ? '<ul class="support-grid">' + items.map(function (x, i) { return '<li class="support reveal" style="--d:' + (i % 4) + '"><span class="s-ico" aria-hidden="true">' + icon(x.icon) + '</span>' + esc(x.label) + '</li>'; }).join('') + '</ul>' : '') +
      '</div></section>';
  }

  function faqs() {
    if (!sectionOn('faqs')) return '';
    return '<section class="section" id="faqs" aria-labelledby="faqs-title"><div class="container">' + head('faqs') + '<div class="faq-list">' + FAQS.map(function (f, i) {
      var answer = f.answer_kind === 'COURSES'
        ? (f.answer ? '<p>' + linkify(f.answer) + '</p>' : '') + '<ul class="faq-courses">' + COURSES.map(function (c) { return '<li>' + esc(courseName(c)) + '</li>'; }).join('') + '</ul>'
        : '<p>' + linkify(f.answer) + '</p>';
      return '<div class="faq-item"><h3 class="faq-h"><button class="faq-q" type="button" id="faq-q' + i + '" aria-expanded="false" aria-controls="faq-a' + i + '"><span>' + esc(f.question) + '</span><span class="faq-icon" aria-hidden="true"></span></button></h3>' +
        '<div class="faq-a" id="faq-a' + i + '"><div>' + answer + '</div></div></div>';
    }).join('') + '</div></div></section>';
  }

  function finalCta(first) {
    if (!sectionOn('get-started')) return '';
    var f = C.final_cta, points = list(f.points).filter(Boolean);
    return '<section class="final-cta' + (first ? ' first' : '') + '" id="get-started" aria-labelledby="cta-title"><div class="container"><div class="cta-card on-dark reveal"><div>' +
      '<h2 id="cta-title">' + esc(f.title) + '</h2>' + (f.text ? '<p>' + esc(f.text) + '</p>' : '') +
      (points.length ? '<ul class="cta-points">' + points.map(function (p) { return '<li>' + icon('check') + esc(p) + '</li>'; }).join('') + '</ul>' : '') + '</div>' +
      actions(pair(f.primary, f.secondary, { size: 'btn-lg', dark: true, arrow: true, lead: true })) + '</div></div></section>';
  }

  function footer() {
    var f = C.footer, nav = navItems();
    var cols = [
      '<div class="footer-about"><a class="brand brand-light" href="#home" aria-label="' + esc(brandName() + ' – Home') + '">' + brand(true) + '</a>' + (f.description ? '<p>' + esc(f.description) + '</p>' : '') + '</div>'
    ];
    if (f.show_quick_links !== false && nav.length)
      cols.push('<nav aria-label="Footer"><h3>' + esc(f.quick_links_title) + '</h3><ul>' + nav.map(function (n) { return '<li><a href="#' + n.section + '">' + esc(n.label) + '</a></li>'; }).join('') + '</ul></nav>');
    if (f.show_programmes !== false && sectionOn('courses'))
      cols.push('<div><h3>' + esc(f.programmes_title) + '</h3><ul>' + COURSES.map(function (c) { return '<li><a href="#courses">' + esc(courseName(c)) + '</a></li>'; }).join('') + '</ul></div>');
    if (f.portal_enabled !== false)
      cols.push('<div class="footer-portal"><h3>' + esc(f.portal_title) + '</h3>' + (f.portal_text ? '<p>' + esc(f.portal_text) + '</p>' : '') + actions(pair(f.primary, f.secondary, { dark: true })) + '</div>');
    return '<div class="container footer-grid" style="--cols:' + cols.length + '">' + cols.join('') + '</div>' +
      '<div class="container footer-bottom"><p>© ' + new Date().getFullYear() + ' ' + esc(f.copyright) + '</p>' + (f.bottom_note ? '<p>' + esc(f.bottom_note) + '</p>' : '') + '</div>';
  }

  /* ======================================================================
     Render and behaviour
     ====================================================================== */
  var reveal = null;
  function setMeta(selector, value) { var el = doc.querySelector(selector); if (el && value) el.setAttribute('content', value); }

  function render(data) {
    C = data.content; COURSES = data.courses; FAQS = data.faqs; LOGO = data.logo;
    if (C.seo.title) doc.title = C.seo.title;
    setMeta('meta[name="description"]', C.seo.description);
    setMeta('meta[name="keywords"]', C.seo.keywords);
    setMeta('meta[property="og:title"]', C.seo.title);
    setMeta('meta[property="og:description"]', C.seo.description);
    setMeta('meta[name="twitter:title"]', C.seo.title);
    setMeta('meta[name="twitter:description"]', C.seo.description);

    var brandLink = doc.getElementById('brand');
    brandLink.innerHTML = brand(false);
    brandLink.setAttribute('aria-label', brandName() + ' – Home');
    var nav = navItems().map(function (n) { return '<li><a href="#' + n.section + '">' + esc(n.label) + '</a></li>'; }).join('');
    doc.getElementById('nav-list').innerHTML = nav;
    doc.getElementById('mobile-nav').innerHTML = nav;
    var headerButtons = button(C.header.login, 'btn-secondary btn-sm') + button(C.header.register, 'btn-primary btn-sm');
    doc.getElementById('header-cta').innerHTML = headerButtons;
    doc.getElementById('mobile-menu-cta').innerHTML = button(C.header.login, 'btn-secondary') + button(C.header.register, 'btn-primary');
    var bar = C.header.mobile_bar !== false ? button(C.header.login, 'btn-secondary') + button(C.header.register, 'btn-primary') : '';
    var barEl = doc.getElementById('mobile-bar');
    barEl.innerHTML = bar;
    barEl.classList.toggle('on', !!bar);
    body.classList.toggle('has-bar', !!bar);

    var main = [about(), courses(), structure(), benefits(), eligibility(), documents(), journey(), placement(), faqs()].join('');
    doc.getElementById('main').innerHTML = hero() + main + finalCta(!main);
    var foot = doc.getElementById('site-footer');
    foot.innerHTML = footer();
    foot.hidden = false;

    /* A logo that does not load: the title text instead. */
    [].slice.call(doc.querySelectorAll('img.brand-logo')).forEach(function (img) {
      img.addEventListener('error', function () {
        var a = img.parentNode;
        if (a) a.innerHTML = '<span class="brand-mark" aria-hidden="true">' + icon('cap') + '</span><span class="brand-text"><span class="l1">' + esc(C.branding.title_line1) + '</span><span class="l2">' + esc(C.branding.title_line2) + '</span></span>';
      });
    });
    startReveal();
    onScroll();
  }

  function startReveal() {
    if (reveal) reveal.disconnect();
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!('IntersectionObserver' in window) || reduce) return;
    root.classList.add('reveal-on');
    reveal = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); reveal.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
    [].slice.call(doc.querySelectorAll('.reveal')).forEach(function (el) { reveal.observe(el); });
  }

  /* Mobile menu */
  var header = doc.querySelector('.site-header');
  var toggle = doc.querySelector('.nav-toggle');
  var menu = doc.getElementById('mobile-menu');
  var backdrop = doc.querySelector('.menu-backdrop');
  var toTop = doc.querySelector('.to-top');
  var isOpen = function () { return menu.classList.contains('open'); };
  function setMenu(open) {
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    menu.classList.toggle('open', open);
    backdrop.classList.toggle('open', open);
    body.classList.toggle('menu-open', open);
    if (open) { var first = menu.querySelector('a'); if (first) first.focus({ preventScroll: true }); }
  }
  toggle.addEventListener('click', function () { setMenu(!isOpen()); });
  backdrop.addEventListener('click', function () { setMenu(false); });
  menu.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a')) setMenu(false); });
  doc.addEventListener('keydown', function (e) {
    if (!isOpen()) return;
    if (e.key === 'Escape') { setMenu(false); toggle.focus(); return; }
    if (e.key === 'Tab') {
      var items = [toggle].concat([].slice.call(menu.querySelectorAll('a[href]')));
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && doc.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && doc.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  var desktop = window.matchMedia('(min-width: 1240px)');
  var onBreakpoint = function (e) { if (e.matches) setMenu(false); };
  if (desktop.addEventListener) desktop.addEventListener('change', onBreakpoint); else if (desktop.addListener) desktop.addListener(onBreakpoint);

  /* FAQ accordion (works across re-renders) */
  doc.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.faq-q') : null;
    if (!btn) return;
    var open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    var item = btn.closest('.faq-item');
    if (item) item.classList.toggle('open', !open);
  });

  /* Header shadow, back-to-top and the menu item of the section in view */
  function onScroll() {
    var y = window.pageYOffset || root.scrollTop || 0;
    header.classList.toggle('scrolled', y > 8);
    toTop.classList.toggle('show', y > 700);
    var line = header.offsetHeight + window.innerHeight * 0.25, current = '';
    [].slice.call(doc.querySelectorAll('main section[id]')).forEach(function (s) { if (s.getBoundingClientRect().top <= line) current = s.id; });
    [].slice.call(doc.querySelectorAll('.nav a, .mobile-menu a')).forEach(function (a) {
      var on = a.getAttribute('href') === '#' + current;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
    });
  }
  var ticking = false;
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; window.requestAnimationFrame(function () { ticking = false; onScroll(); }); } }, { passive: true });
  window.addEventListener('resize', onScroll);

  /* ======================================================================
     Loading: the last content seen is shown at once (if any), then what the
     CMS answers replaces it when it differs; without an answer, the defaults.
     ====================================================================== */
  function normalise(d) {
    var logo = isObj(d.logo) && /^\/[\w/-]+$/.test(String(d.logo.path)) && API ? API + d.logo.path + '?v=' + encodeURIComponent(String(d.logo.version || '')) : '';
    return {
      content: merge(DEFAULT_CONTENT, isObj(d.content) ? d.content : {}),
      courses: list(d.courses).filter(function (c) { return isObj(c) && c.title && c.is_active !== false; }),
      faqs: list(d.faqs).filter(function (f) { return isObj(f) && f.question && f.is_active !== false; }),
      logo: logo
    };
  }
  var DEFAULTS = { content: DEFAULT_CONTENT, courses: DEFAULT_COURSES, faqs: DEFAULT_FAQS, logo: null };
  var shownOnce = false;
  function show(d) {
    var first = !shownOnce;
    render(normalise(d));
    shownOnce = true;
    /* An address with #section: to that section once the page has loaded (the browser looked for it before it existed). */
    if (first && location.hash) {
      var jump = function () {
        var target = doc.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (!target) return;
        try { target.scrollIntoView({ behavior: 'instant', block: 'start' }); } catch (e) { target.scrollIntoView(); }
      };
      if (doc.readyState === 'complete') setTimeout(jump, 0);
      else window.addEventListener('load', function () { setTimeout(jump, 0); });
    }
  }
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { cached = null; }
  if (isObj(cached) && isObj(cached.content)) show(cached); else cached = null;

  if (!API || !window.fetch) {
    if (!cached) show(DEFAULTS);
  } else {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
    fetch(API + '/landing', { headers: { Accept: 'application/json' }, credentials: 'omit', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) {
        clearTimeout(timer);
        var d = json && isObj(json.data) ? json.data : null;
        if (!d || !isObj(d.content)) throw new Error('Unexpected answer');
        var text = JSON.stringify(d);
        try { localStorage.setItem(CACHE_KEY, text); } catch (e) { /* private mode: no cache */ }
        if (!cached || JSON.stringify(cached) !== text) show(d);
      })
      .catch(function () { clearTimeout(timer); if (!cached) show(DEFAULTS); });
  }
})();
</script>
</body>
</html>
