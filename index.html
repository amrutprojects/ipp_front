<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No Referer: page addresses can carry a password reset token or an email ID, which must not reach any server log. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="3 MONTH INTERNSHIP PLACEMENT PROGRAM by Sumago Infotech Pvt. Ltd. – student registration" />
    <!-- The official Sumago Infotech logo (from sumagoinfotech.com). -->
    <link rel="icon" href="/sumago-logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/sumago-logo-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>3 MONTH INTERNSHIP PLACEMENT PROGRAM</title>
    <!--
      The site's home page is the public landing page (public/landing.html, its content from Manage → CMS): opening "/"
      goes there at once, before the portal loads. Every other address (/login, /register, /manage …) is the portal.
      With an Nginx rule `location = / { try_files /landing.html =404; }` the server serves it directly instead.
    -->
    <script>
      if (location.pathname === '/') location.replace('/landing.html' + location.search + location.hash);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
